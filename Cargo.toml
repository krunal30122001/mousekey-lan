[workspace]
resolver = "2"
members = [
    "crates/mkl-protocol",
    "crates/mkl-input",
    "crates/mkl-store",
    "crates/mkl-discovery",
    "crates/mkl-core",
    "crates/mkl-service",
    "src-tauri",
]

[workspace.package]
version = "0.3.2"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
mkl-protocol = { path = "crates/mkl-protocol" }
mkl-input = { path = "crates/mkl-input" }
mkl-store = { path = "crates/mkl-store" }
mkl-discovery = { path = "crates/mkl-discovery" }
mkl-core = { path = "crates/mkl-core" }

anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
snow = "0.9"
sha2 = "0.10"
hex = "0.4"
mdns-sd = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
windows-sys = "0.59"
local-ip-address = "0.6"
gethostname = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

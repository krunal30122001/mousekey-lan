<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="One keyboard and mouse on PC 1 control PC 2: move the cursor past the screen edge and it continues on the other computer over the same Wi-Fi or LAN">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="470" rx="18" fill="#f8fafc"/>
  <text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">One keyboard and mouse, two PCs</text>
  <text x="480" y="72" text-anchor="middle" font-size="15" fill="#475569">Push the cursor past the screen edge and keep working on the other computer</text>

  <!-- PC 1 monitor -->
  <rect x="70" y="100" width="360" height="215" rx="12" fill="#334155"/>
  <rect x="82" y="112" width="336" height="191" rx="6" fill="url(#screen)"/>
  <rect x="98" y="128" width="150" height="90" rx="5" fill="#f1f5f9" opacity="0.92"/>
  <rect x="98" y="128" width="150" height="16" rx="5" fill="#cbd5e1"/>
  <rect x="108" y="154" width="110" height="7" rx="3" fill="#94a3b8"/>
  <rect x="108" y="168" width="80" height="7" rx="3" fill="#94a3b8"/>
  <rect x="108" y="182" width="96" height="7" rx="3" fill="#94a3b8"/>
  <text x="250" y="292" text-anchor="middle" font-size="16" font-weight="600" fill="#e2e8f0">PC 1</text>
  <rect x="225" y="315" width="50" height="22" fill="#475569"/>
  <rect x="185" y="335" width="130" height="10" rx="4" fill="#475569"/>

  <!-- PC 2 monitor -->
  <rect x="530" y="100" width="360" height="215" rx="12" fill="#334155"/>
  <rect x="542" y="112" width="336" height="191" rx="6" fill="url(#screen)"/>
  <rect x="700" y="140" width="160" height="100" rx="5" fill="#f1f5f9" opacity="0.92"/>
  <rect x="700" y="140" width="160" height="16" rx="5" fill="#cbd5e1"/>
  <rect x="712" y="168" width="120" height="7" rx="3" fill="#94a3b8"/>
  <rect x="712" y="182" width="90" height="7" rx="3" fill="#94a3b8"/>
  <rect x="712" y="196" width="104" height="7" rx="3" fill="#94a3b8"/>
  <text x="710" y="292" text-anchor="middle" font-size="16" font-weight="600" fill="#e2e8f0">PC 2</text>
  <rect x="685" y="315" width="50" height="22" fill="#475569"/>
  <rect x="645" y="335" width="130" height="10" rx="4" fill="#475569"/>

  <!-- Cursor path across the edge -->
  <path d="M300 236 C 380 236, 420 214, 480 214 S 590 226, 640 232" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M300 222 l0 24 l6 -6 l5 11 l5 -2 l-5 -11 l8 0 z" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <path d="M648 220 l0 24 l6 -6 l5 11 l5 -2 l-5 -11 l8 0 z" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="418" y="176" width="124" height="26" rx="13" fill="#10b981"/>
  <text x="480" y="194" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">cross the edge</text>

  <!-- Network: both PCs on the same Wi-Fi or LAN -->
  <path d="M315 340 L440 340 M520 340 L645 340" fill="none" stroke="#64748b" stroke-width="2"/>
  <rect x="440" y="322" width="80" height="36" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
  <path d="M465 336 q15 -10 30 0 M470 341 q10 -6 20 0" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round"/>
  <circle cx="480" cy="347" r="2.5" fill="#4f46e5"/>
  <text x="480" y="382" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Same Wi-Fi or LAN</text>
  <text x="480" y="401" text-anchor="middle" font-size="12" fill="#475569">encrypted, nothing goes to the internet</text>

  <!-- Keyboard and mouse under PC 1 -->
  <rect x="80" y="372" width="200" height="54" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <g fill="#94a3b8">
    <rect x="92" y="382" width="16" height="11" rx="2"/><rect x="112" y="382" width="16" height="11" rx="2"/><rect x="132" y="382" width="16" height="11" rx="2"/><rect x="152" y="382" width="16" height="11" rx="2"/><rect x="172" y="382" width="16" height="11" rx="2"/><rect x="192" y="382" width="16" height="11" rx="2"/><rect x="212" y="382" width="16" height="11" rx="2"/><rect x="232" y="382" width="16" height="11" rx="2"/><rect x="252" y="382" width="16" height="11" rx="2"/>
    <rect x="92" y="398" width="20" height="11" rx="2"/><rect x="116" y="398" width="16" height="11" rx="2"/><rect x="136" y="398" width="16" height="11" rx="2"/><rect x="156" y="398" width="16" height="11" rx="2"/><rect x="176" y="398" width="16" height="11" rx="2"/><rect x="196" y="398" width="16" height="11" rx="2"/><rect x="216" y="398" width="16" height="11" rx="2"/><rect x="236" y="398" width="32" height="11" rx="2"/>
    <rect x="132" y="413" width="96" height="8" rx="2"/>
  </g>
  <rect x="298" y="372" width="38" height="56" rx="19" fill="#e2e8f0" stroke="#94a3b8"/>
  <line x1="317" y1="374" x2="317" y2="394" stroke="#94a3b8"/>
  <text x="208" y="450" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Your only keyboard and mouse</text>
  <text x="710" y="382" text-anchor="middle" font-size="13" fill="#475569">No extra keyboard or mouse needed here</text>
</svg>
